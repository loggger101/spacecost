name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Mondays, 06:00 UTC.  The whole workflow runs, which catches dependency
  # drift on a tree nobody has touched -- but the REASON for the schedule is
  # the live-price canary below, the one job whose subject is a third party
  # rather than this repository, and so the one job that can break while
  # nothing here changes.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    # Linux is the point, not an afterthought. The CRLF line terminator in the
    # CSV writer is PINNED, and a Linux runner is what proves the pin holds:
    # unpinned, pandas would take os.linesep and every committed hash would
    # break here while passing on Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.14"]
        # `ubuntu-latest` becomes Ubuntu 26.04 from 2026-10-19, and
        # actions/python-versions builds 3.9 for 22.04 and 24.04 only -- 3.9
        # is past end of life and will not get one.  Left on `latest`, the
        # floor leg would fail at setup-python one Monday with nothing here
        # changed.  It moves to the last Ubuntu that has it, so
        # `requires-python = ">=3.9"` stays tested on Linux; the other Linux
        # legs keep tracking `latest`.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"

    steps:
      # checkout v5 and setup-python v6 are the first majors on Node 24.  The
      # v4 / v5 pair targeted Node 20, which the runners deprecated, and every
      # run carried a warning that they were being forced onto Node 24.
      - uses: actions/checkout@v5
        with:
          # Do NOT let git normalise line endings on checkout: reference/*.csv
          # are CRLF on purpose and the parity test compares bytes.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

      - name: Build the catalog from the CLI
        run: python -m spacecost build -o ./ci_out

      # The sanity bands, as a GATE.  Before v1.15.0 `validate` printed through
      # `say`, which is off by default, so every check it ran was discarded on
      # every build -- including this one.  --strict fails on a WARN and never
      # on a NOTE, which is what makes it safe to leave switched on.
      - name: Validate the tables
        run: python -m spacecost validate --strict

      # reference/ must be what this tree produces.  test_parity.py already
      # compares the bytes of the six tables; this catches the OTHER half -- a
      # summary_meta.json whose row count or stride no longer matches the
      # build, which parity cannot see because it reads those values FROM that
      # file.
      #
      # Runs on every leg.  The two things in reference/ that belong to a
      # MACHINE rather than to the model -- the summary hash with its platform
      # block, and the byte layout of the summary sample -- are reported as
      # information and not as staleness, so this is meaningful on a runner
      # that is not the reference platform. Which, on this matrix, is five legs
      # out of six.
      - name: reference/ is in sync
        run: python tools/refresh_reference.py --check

      # Install the BUILT DISTRIBUTION, not the working tree, and exercise the
      # public API from a directory where the source is not importable.
      #
      # The editable install above cannot see a packaging gap: it imports the
      # tree, so anything present in the tree passes. A consumer gets a built
      # artifact from a tag, which is a different thing -- and that difference
      # already shipped a bug once, when the v0.1.0 tag predated
      # `validate_tables` and a clean install of it could not satisfy
      # economicspace's import.
      - name: Install the built distribution and use it from outside the tree
        shell: bash
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist_check
          python -m venv fresh
          if [ -d fresh/Scripts ]; then PY=fresh/Scripts/python; else PY=fresh/bin/python; fi
          "$PY" -m pip install --quiet dist_check/*.whl
          mkdir -p elsewhere
          cd elsewhere
          "../$PY" -c "
          import spacecost
          for name in spacecost.__all__:
              assert hasattr(spacecost, name), 'missing from the wheel: ' + name
          print('wheel exports', len(spacecost.__all__), 'names, all importable')
          print('spacecost', spacecost.__version__, 'data', spacecost.DATA_VERSION)
          "

      # The consumer contract, asked of the WHEEL rather than the tree.  The
      # `__all__` walk above cannot see a name deleted together with its
      # `__all__` entry, nor anything economicspace reaches through a
      # submodule (`spacecost.delivery`'s three hardware rates,
      # `spacecost.prices.merge_propellant_prices`).  tests/test_consumer_contract.py
      # can, and here it runs against the installed wheel: spacecost is
      # imported, and asserted to be the installed copy, BEFORE pytest loads
      # the test module, so the test's own `import spacecost` cannot reach the
      # tree.
      - name: Hold the built distribution to the consumer contract
        shell: bash
        run: |
          if [ -d fresh/Scripts ]; then PY=fresh/Scripts/python; else PY=fresh/bin/python; fi
          "$PY" -m pip install --quiet pytest
          cd elsewhere
          "../$PY" - <<'PY'
          import sys
          import pytest
          import spacecost
          assert "site-packages" in spacecost.__file__, (
              "the contract would be tested against the tree, not the wheel: "
              + spacecost.__file__)
          sys.exit(pytest.main(["-q", "-p", "no:cacheprovider",
                                "--import-mode=importlib",
                                "../tests/test_consumer_contract.py"]))
          PY

  # ───────────────────────────────────────────────────────────────────────────
  # The reference platform, rebuilt on purpose.
  # ───────────────────────────────────────────────────────────────────────────
  # `test_summary_hash_on_the_reference_platform` is the strictest test in the
  # suite -- the summary's bytes, `exp()` and all -- and it SKIPS anywhere the
  # host is not the platform `reference/summary_meta.json` recorded: same OS,
  # machine, Python minor, numpy and pandas.  The matrix above runs 3.9, 3.12
  # and 3.14 on whatever numpy and pandas are newest, and the platform was
  # recorded on 3.13, so that test was skipped on every leg of every run.  A
  # test that cannot run cannot fail.
  #
  # This job reads the platform out of summary_meta.json, so re-recording it
  # moves the job with it rather than stranding the test again, installs
  # exactly those versions, and sets SPACECOST_REQUIRE_REFERENCE_PLATFORM,
  # under which a mismatch FAILS instead of skipping.
  reference-platform:
    runs-on: windows-latest
    env:
      # ⚠️  THE ONE THING summary_meta.json CANNOT PIN IS THE CPU.  numpy picks
      # its float64 exp() kernel at run time, and on an AVX512 host it takes
      # its own AVX512F implementation instead of the path an AVX2 host
      # takes.  The platform was recorded on an AVX2-only machine, and the
      # first run of this job landed on an AVX2-only runner and reproduced
      # the hash.  Hosted runners are not all the same hardware, so AVX512 is
      # switched off here: the kernel is then the recorded one on any runner,
      # and the job cannot go red on the luck of which VM it drew.  Disabling
      # a feature the CPU lacks changes nothing and raises nothing (checked
      # with numpy 2.2.6 on an AVX2 machine).  These are numpy 2.2's feature
      # names; if the recorded numpy moves, check them against the
      # `show_runtime` step below.
      NPY_DISABLE_CPU_FEATURES: "AVX512F AVX512CD AVX512_SKX AVX512_CLX AVX512_CNL AVX512_ICL"
    steps:
      - uses: actions/checkout@v5
      - name: Read the recorded platform
        id: ref
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("reference/summary_meta.json"))["reference_platform"]
          # runs-on cannot be read from a file.  If the platform is ever
          # re-recorded elsewhere, move runs-on in the same commit.
          assert (p["system"], p["machine"]) == ("Windows", "AMD64"), (
              "summary_meta.json was recorded on %s/%s; move this job's "
              "runs-on to match" % (p["system"], p["machine"]))
          for key in ("python", "numpy", "pandas"):
              print("%s=%s" % (key, p[key]))
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.ref.outputs.python }}
      - name: Install the recorded numpy and pandas
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==${{ steps.ref.outputs.numpy }}" "pandas==${{ steps.ref.outputs.pandas }}" -e ".[test]"
      # numpy picks its exp() kernel by CPU at run time, which is the one
      # thing the recorded platform does not pin.  Printed so a hash mismatch
      # on identical versions can be read from the log.
      - name: Which kernels numpy dispatched to
        run: python -c "import numpy; numpy.show_runtime()"
      - name: The summary hash, required rather than skipped
        env:
          SPACECOST_REQUIRE_REFERENCE_PLATFORM: "1"
        run: python -m pytest -q -rs tests/test_parity.py

  # ───────────────────────────────────────────────────────────────────────────
  # The live-price path, which NOTHING ELSE EXERCISES.
  # ───────────────────────────────────────────────────────────────────────────
  # `use_yfinance` is off by default and every committed reference file is an
  # offline build, which is right -- and it means the fetcher, the three
  # tickers, the unit conversions and the blend weighting are untested on every
  # normal run.  Yahoo renaming a ticker or changing a quote unit would be
  # discovered by a user, in a build, with no error: `fetch_yfinance_fuel_prices`
  # catches every exception per ticker and returns an empty frame, so the whole
  # feature degrades to "reference prices" silently.  That is the correct
  # behaviour for a library and a terrible property for a canary.
  #
  # So: a weekly run that fetches for real and FAILS if a quote is missing or
  # implausible.  Scheduled and manual only -- never on a pull request, because
  # a third-party API being down must not block a merge.
  live-prices:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # NOT continue-on-error.  A canary that cannot go red is a cron job.  It
    # runs on `schedule` and `workflow_dispatch` only, so a Yahoo outage turns
    # one scheduled run red and blocks no merge and no release.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with the live extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[live]"
      - name: Fetch live commodity quotes and sanity-check them
        run: |
          python - <<'PY'
          import spacecost
          from spacecost.config import SpacecostConfig
          from spacecost.prices import (_YFINANCE_TICKERS,
                                        fetch_yfinance_fuel_prices)

          spacecost.set_verbose(True)
          live = fetch_yfinance_fuel_prices(SpacecostConfig(use_yfinance=True))
          if live.empty:
              raise SystemExit(
                  "no live quotes at all: yfinance is unreachable, or all "
                  "three tickers %s have moved" % sorted(_YFINANCE_TICKERS))

          # Bands, not values. A commodity price moves; a price that has left
          # these is a UNIT error, which is what a ticker or quote-unit change
          # actually looks like after the conversion helpers run on it.
          for _, row in live.iterrows():
              usd_kg = float(row["live_cost_usd_per_kg"])
              if not (0.05 <= usd_kg <= 50.0):
                  raise SystemExit(
                      "%s resolved to $%.4f/kg, outside $0.05-$50: that is a "
                      "unit error, not a market move"
                      % (row["name"], usd_kg))
              print("OK %-28s $%8.4f/kg  %s"
                    % (row["name"], usd_kg, row["live_price_source"]))
          print("%d of %d proxies live" % (len(live), len(_YFINANCE_TICKERS)))
          PY
